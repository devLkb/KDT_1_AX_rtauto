# Diagnostic probe A — measure block tilt WITHOUT changing the task.
#
# Every DG5FGraspLift run so far converged to GraspLift/FinalLiftHeight ~ -0.021 m,
# which is close to the -0.0275 m a 0.035 x 0.09 m block's centre drops when it falls
# onto its side. This run disables the new topple termination (topple_limit_deg 180)
# and restores the neutral, uniform-density centre of mass (0.5) so the dynamics are
# identical to the earlier runs, and only reads the new tilt telemetry. If the
# hypothesis holds, GraspLift/MaxObjectTiltDegrees lands near 90.
#
# Compare against dg5f_grasp_lift_probe_fix.yaml, which enables both fixes.
behaviors:
  DG5FGraspLift:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 150000
    max_steps: 150000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # Held at the easiest lesson so the two probes are directly comparable.
  grasp_stage: 1.0
  # 180 deg is unreachable, so IsToppled never fires: telemetry only.
  topple_limit_deg: 180.0
  # 0.5 = uniform density, i.e. the block the earlier runs actually trained against.
  block_com_height_fraction: 0.5
