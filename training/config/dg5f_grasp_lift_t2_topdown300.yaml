# DG5F GraspLift 0.12 m top-down-potential fine-tune from deployed step 3,999,946.
#
# Hypothesis: the current 67.1 deg grasp posture is inside the 70 deg reward gate,
# so raising the new-best top-down potential from 0.3 to 3.0 can overcome the
# side-grasp local optimum while preserving the solved lift.
#
# Decision rule:
#   GraspLift/Success must remain >= 0.95, while
#   GraspLift/GraspPostureAngleDegrees (baseline 67.1 deg) and
#   GraspLift/HandSurfaceContactSeconds (baseline 1.05 s) must fall substantially.
# Falsification: if posture and scraping do not improve over 600k new steps, or
# success falls below 0.95, the stronger potential is ineffective or too disruptive.
behaviors:
  DG5FGraspLift:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0001
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    # Byte-for-byte field match with dg5f_grasp_lift_quality_v2.yaml is required
    # for the solved 57/7 checkpoint.
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 15
    checkpoint_interval: 100000
    # ML-Agents --initialize-from imports weights but resets the new run to step 0.
    max_steps: 600000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  block_height: 0.12
  block_com_height_fraction: 0.20
  grasp_stage: 3.0
  topple_limit_deg: 45.0
  # The 12 cm geometry puts the measured 67.1 deg posture inside the 70 deg gate.
  topdown_potential_max: 3.0
  grasp_posture_penalty_scale: -0.1
  hand_surface_penalty_per_second: -0.5
  # Commanded motion is already ~0.5 deg/joint/decision; tremble was not a reward
  # problem, so do not confound this experiment with an action-rate cost.
  action_rate_penalty_scale: 0
