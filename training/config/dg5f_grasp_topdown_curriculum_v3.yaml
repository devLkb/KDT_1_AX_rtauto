behaviors:
  DG5FGrasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      # Constant schedules: the v1/v2 runs peaked mid-run then coasted because
      # the linear learning-rate decay drove LR toward 0 while the curriculum
      # still had its hardest lessons ahead. A curriculum's late lessons need
      # the same learning capacity as the early ones, and the entropy bonus
      # must stay high enough to keep escaping local optima all the way through.
      learning_rate: 0.0003
      learning_rate_schedule: constant
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # Progress-based (time) gating, NOT reward gating.
  #
  # A reward gate is unusable here: mean cumulative reward is dominated by the
  # dense approach + top-down + dwell shaping, so a policy that approaches and
  # aligns but never actually holds still scores ~0.6-1.1 mean reward. The
  # reward=1.0 gate could never fire (froze every run on lesson 1); the
  # reward=0.6 gate fired on carried-over shaping reward and skipped lessons 2
  # and 3 in ~20k steps each, before the policy had adapted to the harder hold,
  # collapsing success to a few percent.
  #
  # `progress` = global_step / max_steps. Each threshold is the cumulative
  # training fraction at which the lesson advances, so every lesson gets a
  # fixed, guaranteed step budget regardless of the shaping-inflated reward.
  # The budget is front-loaded on the 0.5 s / 60 deg / 2.5 cm contract (lesson
  # 2), which is the real target and where v2 plateaued: lesson 1 is nearly
  # solved by the transferred policy (0.2 s -> 0.4 s), so it gets 200k steps,
  # and lesson 2 gets ~700k dedicated steps.
  hold_stage:
    curriculum:
      - name: topdown_80deg_hold_025s_tolerance_3cm
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.1
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: topdown_60deg_hold_050s_tolerance_25mm
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.55
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: topdown_45deg_hold_1s_tolerance_2cm
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.75
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
      - name: topdown_30deg_hold_2s_tolerance_15mm
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.9
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 4.0
      - name: topdown_15deg_hold_3s_tolerance_1cm
        value:
          sampler_type: constant
          sampler_parameters:
            value: 5.0
