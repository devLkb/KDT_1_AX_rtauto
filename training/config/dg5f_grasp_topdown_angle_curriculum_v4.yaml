behaviors:
  DG5FGrasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      learning_rate_schedule: constant
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # ANGLE curriculum. The objective is pre-grasp positioning: park the hand
  # vertically above the object at a graspable top-down angle, then hand off to
  # the grasp controller. Hold is now a fixed 0.3 s pre-grasp dwell for every
  # stage (decoupled in Dg5fGraspSpec), so tightening the stage only tightens
  # the approach angle (80 -> 60 -> 45 -> 30 deg) and the position tolerance.
  #
  # Progress-based (time) gating: each stage gets a guaranteed step budget,
  # front-loaded onto the tight angles. The curriculum stops at stage 4 (30 deg,
  # the target); stage 5 (15 deg) is intentionally not scheduled.
  hold_stage:
    curriculum:
      - name: angle_80deg
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.1
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: angle_60deg
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.3
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: angle_45deg
        completion_criteria:
          measure: progress
          behavior: DG5FGrasp
          threshold: 0.55
          min_lesson_length: 500
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
      - name: angle_30deg_target
        value:
          sampler_type: constant
          sampler_parameters:
            value: 4.0
