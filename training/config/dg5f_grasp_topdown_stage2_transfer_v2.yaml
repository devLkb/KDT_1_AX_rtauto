behaviors:
  DG5FGrasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      # Stage 2 v1 froze: LR 2e-5 + beta 1e-4 left entropy pinned at -0.40 and
      # policy loss flat, so the transferred policy could not leave the
      # risk-averse hover optimum. Restore a standard PPO learning rate and a
      # real entropy bonus so the softened descent-abort penalty can actually
      # be explored.
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # Fixed at Stage 2 (60 deg / 0.5 s / 2.5 cm). Paired with the softened
  # DescentAbortPenalty (-0.5, was -2) in Dg5fGraspSpec so descending toward
  # the surface is no longer dominated by the failure cliff.
  hold_stage:
    sampler_type: constant
    sampler_parameters:
      value: 2.0
