behaviors:
  DG5FGrasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      # Constant schedules so the extra budget keeps full learning capacity and
      # exploration the whole way (linear decay is what stalled v1/v2).
      learning_rate: 0.0003
      learning_rate_schedule: constant
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # Fixed at the 60 deg / 0.5 s / 2.5 cm contract. The v3prog curriculum reached
  # ~17-38% genuine contract completions at this lesson and was still oscillating
  # upward when its 700k progress budget cut it off and advanced to lesson 3.
  # This run initializes from that lesson-2 policy and spends a full extra 1M
  # steps entirely on the 0.5 s hold to see if reliability breaks past ~40%.
  hold_stage:
    sampler_type: constant
    sampler_parameters:
      value: 2.0
