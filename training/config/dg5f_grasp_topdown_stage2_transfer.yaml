behaviors:
  DG5FGrasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.00002
      beta: 0.0001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  # Stage 1 reached a stable 71.6-degree policy but never advanced because
  # ML-Agents gates lessons on a 500-episode mean reward, not on angle. Keep
  # this run fixed at Stage 2 so its entire fresh learning-rate budget trains
  # the 60-degree / 0.5-second / 2.5-centimeter contract.
  hold_stage:
    sampler_type: constant
    sampler_parameters:
      value: 2.0
