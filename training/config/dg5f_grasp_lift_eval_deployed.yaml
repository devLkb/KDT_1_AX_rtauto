# DG5F GraspLift inference-only evaluation of the deployed 0.12 m policy.
#
# Run with --resume --inference so no learning occurs. This reproduces evaluation
# at the promoted 0.12 m / 0.20 COM defaults with all motion-quality penalties
# disabled.
#
# dg5f_grasp_lift_eval_h012_com050.yaml is the uniform-density robustness
# counterpart.
behaviors:
  DG5FGraspLift:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0001
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    # Byte-for-byte field match with dg5f_grasp_lift_quality_v2.yaml is required
    # for the solved 57/7 checkpoint.
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    # The deployed checkpoint is at step 1,500,077, so max_steps must exceed it
    # or ML-Agents has no remaining inference budget after --resume.
    max_steps: 1700000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  device: cpu

environment_parameters:
  block_height: 0.12
  block_com_height_fraction: 0.20
  grasp_stage: 3.0
  topple_limit_deg: 45.0
  grasp_posture_penalty_scale: 0
  hand_surface_penalty_per_second: 0
  action_rate_penalty_scale: 0
